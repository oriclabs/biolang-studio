name: Deploy Studio

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: studio-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Studio
        uses: actions/checkout@v7
        with:
          path: biolang-studio
      - name: Check out BioLang runtime
        uses: actions/checkout@v7
        with:
          repository: oriclabs/biolang
          path: biolang
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: biolang-studio/package-lock.json
      - uses: actions/configure-pages@v6
      - name: Build
        working-directory: biolang-studio
        run: |
          npm ci
          npm run build
      - name: Verify custom-domain artifact
        working-directory: biolang-studio
        run: test "$(cat dist/CNAME)" = "studio.lang.bio"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: biolang-studio/dist
  deploy:
    environment:
      name: github-pages
      url: https://studio.lang.bio
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
